<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels Player</title>
<style>
:root{color-scheme:dark;--bg:#0c0b0d;--card:#17151a;--ink:#f5f3f6;--mute:#9d97a3;--line:#29262d;--hot:#ff4d5e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif;padding-bottom:130px}
.top{position:sticky;top:0;z-index:5;background:rgba(12,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:20px;margin:0 8px 0 0}
select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px}
button{cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;background:linear-gradient(160deg,#3a1f2a,#120f16 60%,#1d1626);display:grid;place-items:center;border:0;border-radius:0;width:100%;padding:0}
.thumb .play{width:64px;height:64px;border-radius:50%;background:var(--hot);display:grid;place-items:center;font-size:26px;padding-left:5px}
.thumb .who{position:absolute;left:12px;top:10px;font-weight:700;font-size:14px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px}
.thumb .st{position:absolute;left:12px;bottom:10px;font-size:13px;color:#fff;opacity:.9}
.vid{position:relative;width:100%;aspect-ratio:3/4.95;overflow:hidden;background:#000}
.vid iframe{position:absolute;border:0;width:147%;left:-23.5%;top:-80px;height:1000px;background:#000}
.nope{aspect-ratio:3/4.95;display:grid;place-items:center;text-align:center;padding:16px;color:var(--mute);font-size:14px;background:#111}
.nope a{display:inline-block;margin-top:10px;color:#fff;border:1px solid #555;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:600}
.thumb{aspect-ratio:3/4.95}
.info{padding:10px 12px;display:grid;gap:8px}
.cap{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.row{display:flex;gap:8px}.row button{flex:1}
.sel{background:var(--hot);border-color:var(--hot);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#17151aee;border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar b{margin-right:auto}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;font:13px monospace;display:none}
.sheet{position:fixed;inset:0;z-index:20;display:none;place-items:end center;background:rgba(0,0,0,.6)}.sheet.open{display:grid}
.panel{width:min(520px,100%);background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px 24px;display:grid;gap:14px;max-height:92vh;overflow:auto}
.panel h2{margin:0;font-size:22px}.mute{color:var(--mute);font-size:14px}.lbl{font-size:14px;font-weight:600;display:grid;gap:6px}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.models button{min-height:56px;text-align:left}
.models button[aria-pressed=true]{border-color:var(--hot);background:#ff4d5e22}
.panel input{min-height:46px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
.foot{display:flex;gap:8px}.foot button{flex:1}.foot .hot{background:var(--hot);border-color:var(--hot);color:#fff;flex:2}
.note{padding:0 16px;color:var(--mute);font-size:14px;max-width:1300px;margin:12px auto 0}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <h1>Reels Player</h1>
  <select id="fc" aria-label="Creator"></select>
  <select id="fs" aria-label="Sort"><option value="likes">Most likes</option><option value="views">Most views</option><option value="orig">As saved</option></select>
  <select id="fp" aria-label="Playable"><option value="1">Playable only</option><option value="0">Include unplayable</option></select>
  <select id="fm" aria-label="Minimum likes"><option value="0">Any likes</option><option value="1000">1K+ likes</option><option value="5000">5K+ likes</option><option value="20000">20K+ likes</option></select>
</div>
<p class="note">Tap a card to play it here. 119 of the 183 play; the other 64 have embedding turned off by Instagram and open on Instagram instead. Tap Recreate on the ones you want, choose the model and outfit, then Copy list and paste it to me.</p>
<main class="grid" id="grid"></main>

<div class="bar">
  <b id="cnt">0 picked</b>
  <button id="copy">Copy list</button><button id="clear">Clear</button>
  <textarea id="out" readonly></textarea>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="panel">
    <h2 id="sh-t">Recreate this reel</h2>
    <div id="sh-src" class="mute"></div>
    <div><div class="lbl">Model</div><div class="models" id="sh-models"></div></div>
    <label class="lbl">Outfit
      <select id="sh-outfit"><option value="1">Outfit 1</option><option value="2">Outfit 2</option><option value="3">Outfit 3</option></select>
    </label>
    <label class="lbl">Notes (optional)
      <input type="text" id="sh-note" maxlength="200" placeholder="e.g. keep the car background">
    </label>
    <div class="foot"><button id="sh-remove">Remove</button><button id="sh-cancel">Cancel</button><button id="sh-add" class="hot">Add to list</button></div>
  </div>
</div>

  $('#sh-src').textContent='@'+r.c+' · ♥ '+fmt(r.likes)+(r.views?' · ▶ '+r.views:'');
  $('#sh-models').innerHTML=MODELS.map(m=>'<button data-m="'+m+'" aria-pressed="'+(m===curModel)+'">'+m+'</button>').join('');
  $('#sh-outfit').value=ex?ex.outfit:($('#sh-outfit').value||'1');$('#sh-note').value=ex?ex.note:'';
  $('#sh-remove').style.display=ex?'':'none';$('#sheet').classList.add('open');
}
const closeSheet=()=>{$('#sheet').classList.remove('open');curId=null};
function refreshBtn(id){const b=document.querySelector('[data-pick="'+CSS.escape(id)+'"]');if(!b)return;const v=P[id];b.classList.toggle('sel',!!v);b.textContent=v?'✓ '+v.model+' · Outfit '+v.outfit:'Recreate'}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.play){const w=document.createElement('div');w.className='vid';const f=document.createElement('iframe');f.src='https://www.instagram.com/reel/'+b.dataset.play+'/embed/';f.allow='autoplay; encrypted-media';f.title='Reel';w.append(f);b.replaceWith(w)}
  else if(b.dataset.pick){openSheet(b.dataset.pick)}
  else if(b.dataset.m){curModel=b.dataset.m;document.querySelectorAll('#sh-models button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===curModel))}
  else if(b.id==='sh-cancel'){closeSheet()}
  else if(b.id==='sh-remove'){const id=curId;delete P[id];save();closeSheet();refreshBtn(id);bar()}
  else if(b.id==='sh-add'){const id=curId;P[id]={model:curModel,outfit:$('#sh-outfit').value,note:$('#sh-note').value.trim()};save();closeSheet();refreshBtn(id);bar()}
  else if(b.id==='clear'){P={};save();render();bar()}
  else if(b.id==='copy'){
    if(!Object.keys(P).length)return;const t=listText(),ta=$('#out');ta.value=t;ta.style.display='block';ta.select();
    try{await navigator.clipboard.writeText(t)}catch{try{document.execCommand('copy')}catch{}}
    b.textContent='Copied';setTimeout(()=>b.textContent='Copy list',1600);
  }
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
for(const id of ['fc','fs','fm','fp'])$('#'+id).addEventListener('change',render);
render();bar();
}
</script>
</body>
</html>
